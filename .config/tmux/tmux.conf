set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Keep window names sticky. Without this, `claude` (and bash) overwrite the
# name we set via `tmux new-window -n`.
set-option -g allow-rename off
set-option -g automatic-rename off

# Screen-style ^A A to rename the current window (in addition to the built-in
# `prefix ,`).
bind-key A command-prompt -p 'rename window:' 'rename-window "%%"'

# Minimal tmux status theme
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-bg '#5f87af'
set -g @minimal-tmux-indicator true

# TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
