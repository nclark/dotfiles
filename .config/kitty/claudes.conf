# https://sw.kovidgoyal.net/kitty/conf/
# claudes archive TUI overlay — sized/positioned by yabai scratchpad rule

remember_window_size no
window_padding_width 10
hide_window_decorations titlebar-only
macos_quit_when_last_window_closed true
# NOTE: must stay "no" — with "yes" kitty becomes an accessory app and yabai
# (macOS 26+) gets no AX reference to its windows: title reads empty, the
# scratchpad rule misses, and the window can't be floated/resized at all.
macos_hide_from_tasks no
font_family Hack Nerd Font Mono
font_size 14.0

# lighter than the usual 0d0d0d so it reads as "overlay" at a glance
background #23232e

tab_bar_edge top

# every new tab boots another claudes tui
map cmd+t launch --type=tab /Users/nclark/claudes/bin/claudes tui

# cmd+1-9 tab switching (kitty's defaults are ctrl+shift+arrows / ctrl+tab,
# which skhd intercepts globally)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
