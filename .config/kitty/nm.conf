# https://sw.kovidgoyal.net/kitty/conf/
# nm (necromat) calculator overlay — sized/positioned by the yabai "nm" rule

remember_window_size no
window_padding_width 10
hide_window_decorations titlebar-only
# Must stay "true": each kitty CLI launch is its own process, so this quits only
# the nm instance. Without it, :q leaves a zero-window kitty that yabai lists as
# a husk entry, which wedges the toggle. (Same reasoning as eno.conf.)
macos_quit_when_last_window_closed true
# Must stay "no": with "yes" yabai gets no AX reference and can't float it.
macos_hide_from_tasks no
font_family Hack Nerd Font Mono
font_size 16.0

# same theme as Ghostty
include themes/retro-82.conf
