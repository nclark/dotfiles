#:schema https://yazi-rs.github.io/schemas/theme.json
# High-visibility Retro 82: warm colors (cream, orange, gold, red) on the
# navy background, no teal or green. Anything not set here is Yazi's dark
# preset.
#
#   navy   #05182e  (terminal background)    cream  #f6dcac  (terminal text)
#   orange #faa968  light / #e97b3c deep      gold   #ffd27f
#   red    #f85525                            slate  #3d5a7a  (borders)

[mgr]
cwd          = { fg = "#faa968", bold = true }
border_style  = { fg = "#3d5a7a" }
border_symbol = "┃"
find_keyword  = { fg = "#ffd27f", bold = true, underline = true }
find_position = { fg = "#faa968", bold = true }

# The cursor row: a solid cream bar, the most visible thing on screen.
[indicator]
parent  = { fg = "#f6dcac", bg = "#1f3a57", bold = true }
current = { fg = "#05182e", bg = "#f6dcac", bold = true }
preview = { fg = "#05182e", bg = "#faa968" }

[tabs]
active   = { fg = "#05182e", bg = "#f6dcac", bold = true }
inactive = { fg = "#f6dcac", bg = "#1f3a57" }

[mode]
normal_main = { fg = "#05182e", bg = "#f6dcac", bold = true }
normal_alt  = { fg = "#f6dcac", bg = "#1f3a57" }
select_main = { fg = "#05182e", bg = "#faa968", bold = true }
select_alt  = { fg = "#faa968", bg = "#1f3a57" }
unset_main  = { fg = "#05182e", bg = "#f85525", bold = true }
unset_alt   = { fg = "#f85525", bg = "#1f3a57" }

[status]
perm_sep        = { fg = "#3d5a7a" }
perm_type       = { fg = "#faa968" }
perm_read       = { fg = "#f6dcac" }
perm_write      = { fg = "#f85525" }
perm_exec       = { fg = "#ffd27f" }
progress_normal = { fg = "#faa968", bg = "#1f3a57" }
progress_error  = { fg = "#05182e", bg = "#f85525" }

# File name colors. Same order as Yazi's preset, recolored.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "#ffd27f" },
	{ mime = "**/{audio,video}/*", fg = "#ff9fb2" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f85525" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#ffffff" },
	{ mime = "vfs/{absent,stale}", fg = "#5a6b7d" },
	{ url = "*", is = "orphan", fg = "#05182e", bg = "#f85525" },
	{ url = "*", is = "exec", fg = "#ffffff", bold = true },
	{ url = "*", is = "dummy", fg = "#05182e", bg = "#f85525" },
	{ url = "*/", is = "dummy", fg = "#05182e", bg = "#f85525" },
	{ url = "*/", fg = "#faa968", bold = true },
]

# Git status markers (plugins/git.yazi reads th.git).
[git]
updated   = { fg = "#faa968" }
added     = { fg = "#ffd27f" }
deleted   = { fg = "#f85525" }
untracked = { fg = "#f6dcac" }
ignored   = { fg = "#5a6b7d" }

# Icons: Yazi's preset (same shapes and variety), with every green/teal
# shade swapped for a warm color so nothing green shows on the navy.
[icon]
globs = []
dirs  = [
