set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Keep window names sticky. Without this, `claude` (and bash) overwrite the
# name we set via `tmux new-window -n`.
set-option -g allow-rename off
set-option -g automatic-rename off

# Screen-style ^A A to rename the current window (in addition to the built-in
# `prefix ,`).
bind-key A command-prompt -p 'rename window:' 'rename-window "%%"'

# Number windows from 1 so Ghostty's cmd+1..9 (mapped to prefix+N) match
# the way tabs count. renumber keeps them gapless after closing one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Herdr TUI-style panes: prefix+v splits side by side, prefix+- stacks,
# prefix+h/j/k/l moves between panes. New panes keep the current directory.
# (prefix+z zoom and prefix+x close are tmux defaults, same as herdr.)
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane borders in Ghostty's Retro 82 colors (instead of tmux's default green)
set -g pane-border-style "fg=#134e5a"
set -g pane-active-border-style "fg=#3f8f8a"

# Minimal tmux status theme
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-bg '#5f87af'
set -g @minimal-tmux-fg '#ffffff'
set -g @minimal-tmux-status 'top'
# Wider labels so the bar reads bigger (tmux can't make the line taller).
set -g @minimal-tmux-window-status-format '   #I:#W   '
set -g @minimal-tmux-indicator true
# No underline on the current tab (tmux's default style underscores it).
set -g window-status-current-style default

# TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'

