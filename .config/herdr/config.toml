onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

# --- Herdr Annotate (plannotator/herdr-annotate) ---
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent prompt and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# --- Pane helpers ---
[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "~/.config/herdr/scripts/break-pane.sh"
width = 60
height = 5
description = "move/break pane to its own new tab"
