#:schema https://yazi-rs.github.io/schemas/yazi.json
# Strata-ish Yazi: Miller columns with a big preview, natural sort, sizes,
# git status, sharper image previews for the Retina screen.

[mgr]
ratio          = [ 1, 3, 4 ]       # parent, current, preview (preview gets the most room)
sort_by        = "natural"         # file2 before file10
sort_dir_first = true
linemode       = "size"
show_hidden    = false             # "." toggles
scrolloff      = 8

[preview]
max_width     = 2400
max_height    = 2400
image_filter  = "lanczos3"
image_quality = 90

# Git status column (plugins/git.yazi)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Markdown previews rendered by glow (plugins/piper.yazi runs the command
# and shows its output in the preview pane).
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1" </dev/null'
